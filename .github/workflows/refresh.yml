name: Refresh data and publish

on:
  schedule:
    - cron: "17 10 * * *"   # every day, about 5:17 AM Eastern
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "site/img/**"]

permissions:
  contents: write   # save refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest data, even on a queued run
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch fresh data
        # Skip the slow fetch on code pushes; the schedule and the button do it.
        if: github.event_name != 'push'
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: node scripts/refresh.mjs
      - name: Save data to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/img
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Data refresh $(date -u +%F)"
          git pull --rebase -q origin main
          git push -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
