<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VoteDex</title>
<meta name="description" content="See how Congress and the New Hampshire legislature vote, who pays for their campaigns, and what bills mean for you, in plain English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE playful, game-like, very few words
   IDEA a retro stadium scoreboard: pixel map as the field, members as player cards
   PICTURE pixelated US map rasterized from real state shapes, coloured by Senate delegation
   COLOUR night scoreboard ground, cream ink, party blue / red / purple, scoreboard yellow accent
   TYPE Press Start 2P for logo and headings only + Public Sans for text and every number
   LAYOUT one column; map fills the width; state = roster grid; member = stat card */
:root{color-scheme:dark;--bg:#0e1320;--panel:#171e30;--line:#2a3550;--ink:#f3ecd8;--mute:#9aa3bb;--D:#3d7bff;--R:#ff4b3e;--I:#a66bff;--y:#ffd23f;--ok:#3ee07a;--empty:#1d2538}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 "Public Sans",system-ui,sans-serif;font-variant-numeric:lining-nums;overflow-x:clip;image-rendering:pixelated}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.px{font-family:"Press Start 2P",monospace;letter-spacing:0;line-height:1.35}
.wrap{max-width:900px;margin:0 auto;padding-left:max(4vw,16px,env(safe-area-inset-left,0px));padding-right:max(4vw,16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:16px 6px}
.logo{font-size:clamp(14px,3.4vw,18px);text-decoration:none;color:var(--y)}
nav{margin-left:auto;display:flex;gap:6px}
.nav{font-size:10px;text-decoration:none;padding:9px 10px;border:2px solid var(--line)}
.nav.on{border-color:var(--y);color:var(--y)}
.vbtn{font-family:"Public Sans",sans-serif;font-weight:800;font-size:15px;padding:12px 16px;border:2px solid var(--line);background:var(--bg);min-width:72px}
.vbtn.on.y{background:var(--ok);color:#06200f;border-color:var(--ok)}
.vbtn.on.n{background:var(--R);color:#2a0400;border-color:var(--R)}
.ballot{background:var(--panel);border:2px solid var(--line);padding:14px;display:grid;gap:10px}
.ballot .vb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ballot .t{font-weight:600;font-size:18px}
.score{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.score .pl .pct{font-family:"Public Sans",sans-serif;font-weight:800;font-size:24px;color:var(--y)}
.score .pl small{color:var(--mute);font-size:14px}
.btn{font-family:"Press Start 2P",monospace;font-size:11px;border:2px solid var(--y);color:var(--y);padding:10px 12px;display:inline-block;text-decoration:none;margin-top:12px}
.back{margin-left:auto;font-family:"Press Start 2P",monospace;font-size:11px;border:2px solid var(--ink);padding:9px 12px;box-shadow:3px 3px 0 var(--line)}
.back:active{transform:translate(2px,2px);box-shadow:none}
main{padding-block:8px 40px}
h1{font-family:"Press Start 2P",monospace;font-size:clamp(20px,5vw,34px);line-height:1.25;margin:10px 0 8px;font-weight:400}
h2{font-family:"Press Start 2P",monospace;font-size:12px;color:var(--y);margin:26px 0 10px;font-weight:400}
.hint{color:var(--mute);margin:0 0 10px}
.map canvas{display:block;margin:0 auto;touch-action:manipulation}
select{font:inherit;font-size:16px;margin-top:14px;width:100%;max-width:340px;padding:10px;background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--mute);margin-top:8px}
.key i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.split{background:repeating-linear-gradient(90deg,var(--D) 0 6px,var(--R) 6px 12px)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pl{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--panel);border:2px solid var(--line);padding:10px;text-decoration:none;position:relative}
.pl:hover{border-color:var(--ink)}
.pl .num{position:absolute;top:8px;right:8px;font-family:"Public Sans",sans-serif;font-weight:800;font-size:14px;color:var(--mute)}
.pl b{font-weight:600;line-height:1.2}
.ava{width:40px;height:48px;display:block;overflow:hidden;flex:none;border:2px solid rgba(0,0,0,.35)}
.ava img{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.card{border:3px solid var(--ink);background:var(--panel);box-shadow:6px 6px 0 var(--line)}
.card .top{display:flex;gap:14px;align-items:center;padding:16px;border-bottom:3px solid var(--ink)}
.card .top .ava{width:80px;height:96px}
.card .jersey{margin-left:auto;font-family:"Public Sans",sans-serif;font-weight:800;font-size:clamp(26px,7vw,44px);text-align:right}
.card .jersey small{display:block;font-size:9px;color:var(--mute);margin-top:4px}
.card .nm{font-weight:800;font-size:clamp(20px,4.6vw,28px);line-height:1.15;letter-spacing:-.01em}
.card .pos{color:var(--mute);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stats div{padding:14px 12px;border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
.stats div:nth-child(3n){border-right:0}
.stats b{display:block;font-family:"Public Sans",sans-serif;font-weight:800;font-size:clamp(24px,6vw,34px);color:var(--y);letter-spacing:-.02em}
.stats b.na{color:var(--mute)}
.stats span{font-size:14px;color:var(--mute)}
.log{display:grid;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:10px 12px;text-decoration:none}
.row small{color:var(--mute);font-size:14px;display:block}
.tag{font-family:"Public Sans",sans-serif;font-weight:800;font-size:13px;padding:7px 8px;white-space:nowrap}
.tag.y{background:var(--ok);color:#06200f}
.tag.n{background:var(--R);color:#2a0400}
.tag.o{background:var(--empty);color:var(--mute)}
.empty{border:2px dashed var(--line);padding:14px;color:var(--mute)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{border:2px solid var(--line);padding:6px 12px;font-size:15px;text-decoration:none}
.links a:hover{border-color:var(--ink)}
.sec{margin:10px 0;padding-left:12px;border-left:4px solid var(--line)}
.sec b{color:var(--y);font-weight:600}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:12px}
.sides div{background:var(--panel);padding:10px 12px;font-size:16px}
.sides b{display:block;color:var(--mute);font-weight:600;font-size:14px}
.you{background:var(--panel);border:2px solid var(--y);padding:14px 16px;margin-top:10px}
.you ul{margin:6px 0 0;padding-left:20px}
.you li{margin:4px 0}
dl.terms{margin:0;display:grid;gap:10px}
dl.terms div{background:var(--panel);padding:10px 14px}
dl.terms dt{font-weight:700;color:var(--y)}
dl.terms dd{margin:2px 0 0}
.feed{display:grid;gap:8px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;background:var(--panel);border:2px solid var(--line);padding:12px 14px;text-decoration:none}
.ev .d{font-weight:800;color:var(--y);white-space:nowrap;font-size:15px}
.ev small{color:var(--mute);display:block}
.ev .mine{grid-column:2;font-size:15px}
.tg{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);padding:12px 14px;cursor:pointer}
.tg input{flex:none;width:22px;height:22px;accent-color:#ffd23f}
.ok{color:var(--ok);font-size:15px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip2{border:2px solid var(--line);padding:8px 12px;font-weight:600;font-size:15px}
.chip2.on{border-color:var(--y);color:var(--y)}
.chip2 b{margin-left:4px}
.pay{grid-column:1/-1;font-size:13px;color:var(--mute)}
.cty{margin:6px 0}
.cty summary{font-weight:700}
.cty .roster{margin-top:10px}
.pick{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.pick label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.pick select{margin:0;width:auto;min-width:180px}
.addr{display:flex;gap:8px;margin:6px 0}
.addr input{flex:1;font:inherit;font-size:16px;padding:10px 12px;background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.more summary{list-style:none;cursor:pointer}.more summary::-webkit-details-marker{display:none}.more[open] summary{display:none}
.bk{font-size:11px;border:2px solid var(--ink);padding:10px 14px;margin-top:6px;box-shadow:3px 3px 0 var(--line);background:var(--bg)}
.bk:active{transform:translate(2px,2px);box-shadow:none}
.sl{margin-top:30px;border:2px solid var(--line);background:var(--panel);padding:0 14px}
.sl>summary{cursor:pointer;list-style:none;padding:16px 0;font-size:13px;color:var(--y);display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.sl>summary::-webkit-details-marker{display:none}
.sl>summary::before{content:"▸";font-family:'Public Sans';font-size:16px}
.sl[open]>summary::before{content:"▾"}
.sl[open]{padding-bottom:14px}
.contact{margin:8px 0}
.contact summary{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--y);padding:6px 0}
.contact textarea{width:100%;margin-top:10px;font:inherit;font-size:16px;padding:10px;background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.contact .vbtn{margin-top:8px}
footer{color:var(--mute);font-size:13px;padding-block:6px 28px}
@media(max-width:480px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}.card .top{padding:12px;gap:10px}.card .top .ava{width:60px;height:72px}}
</style>

  <h2>RECENT VOTES</h2>${key.length?`<div class="log">${key.slice(0,5).map(({v,k})=>`<a class="row" ${vLink(v)?`href="${vLink(v)}"`:""}><span>${esc(plainQ(v.q))}<small>${esc(vTitle(v))} · ${fmtD(v.date)}</small></span><span class="tag ${TAG[k][1]}">${TAG[k][0]}</span></a>`).join("")}</div>
  <p class="hint" style="font-size:14px;margin-top:8px">${vs.length} roll calls this Congress · missed ${missed}</p>`:`<div class="empty">No votes loaded yet.</div>`}

  :`<div class="empty">${m.fec?"Not loaded yet. Donor data fills in over the next few days.":"No FEC campaign found for this member."}</div>`}

  wireContact();

function slug(m,sep){return(m.fl||m.n).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z ]/g,"").trim().replace(/\s+/g,sep)}
async function memHistory(id,f){
  const m=byId[id];if(!m){app.innerHTML="<p>Not found.</p>";return}
  f=f||"key";
  const map=await mVotes(id);
  let vs=Object.entries(map).map(([vid,k])=>({v:VI[vid],k})).filter(x=>x.v).sort((a,b)=>b.v.date.localeCompare(a.v.date)||b.v.id.localeCompare(a.v.id));
  const broke=x=>(x.k==="Y"||x.k==="N")&&x.v.pm[m.vp||m.p]&&x.v.pm[m.vp||m.p]!==x.k;
  const F={key:x=>x.v.big||x.v.bill,all:()=>1,yes:x=>x.k==="Y",no:x=>x.k==="N",broke,missed:x=>x.k==="X"};
  const cnt=Object.fromEntries(Object.entries(F).map(([k,fn])=>[k,vs.filter(fn).length]));
  vs=vs.filter(F[f]);const shown=vs.slice(0,300);
  const yr={};shown.forEach(x=>{const y=x.v.date.slice(0,4);(yr[y]=yr[y]||[]).push(x)});
  app.innerHTML=`<a href="#m-${esc(m.id)}" class="hint">‹ ${esc(m.n)}</a><h1>Vote history</h1>
  <div class="chips">${[["key","Bills"],["all","Every vote"],["yes","Yes"],["no","No"],["broke","Broke with party"],["missed","Missed"]].map(([k,t])=>`<button class="chip2 ${f===k?"on":""}" data-f="${k}">${t} <b>${cnt[k]}</b></button>`).join("")}</div>
  ${Object.keys(yr).sort().reverse().map(y=>`<h2>${y}</h2><div class="log">${yr[y].map(({v,k})=>`<div class="row"><span>${vLink(v)?`<a href="${vLink(v)}">${esc(plainQ(v.q))}</a>`:esc(plainQ(v.q))}<small>${esc(vTitle(v))} · ${fmtD(v.date)}${broke({v,k})?` · <b style="color:var(--y)">broke with party</b>`:""} · <a href="${vSrc(v)}">official record ↗</a></small></span><span class="tag ${TAG[k][1]}">${TAG[k][0]}</span></div>`).join("")}</div>`).join("")||`<div class="empty">No votes here.</div>`}
  ${vs.length>shown.length?`<p class="hint">Showing the latest ${shown.length} of ${vs.length}.</p>`:""}
  <h2>OLDER VOTES</h2><div class="empty">This page covers the current Congress. Older votes are on these sites:
   <div class="links"><a href="https://www.govtrack.us/congress/members/${slug(m,"_")}/${esc(m.gt)}">GovTrack votes ↗</a><a href="https://www.congress.gov/member/${slug(m,"-")}/${esc(m.id)}">Congress.gov ↗</a></div></div>`;
  app.querySelectorAll(".chip2").forEach(b=>b.onclick=()=>memHistory(id,b.dataset.f));
}
async function bill(id){
  const b=BB[id],info=BL[id];if(!b&&!info){app.innerHTML="<p>Not found.</p>";return}
  app.innerHTML=`<p class="hint">Loading…</p>`;
  const[list,extra]=await Promise.all([votesOnBill(id),b?null:J(`data/bills/${id}.json`)]);if(location.hash!=="#b-"+id)return;
  const sp=byId[(b&&b.sponsor)||(info&&info.sponsor)];
  const big=list.filter(v=>v.big);
  const delegationHTML=store.home?`<h2>${esc(SN[store.home]).toUpperCase()} VOTED</h2><div class="log">${delegation(store.home).map(m=>{const bv=billVote(m,id),fv=bv&&bv.raw;return`<a class="row" href="#m-${esc(m.id)}"><span>${esc(m.n)}<small>${m.c==="s"?"Senate":"House"}${bv?" · "+bv.q:""}</small></span><span class="tag ${fv==="Yea"?"y":fv==="Nay"?"n":"o"}">${fv==="Yea"?"YES":fv==="Nay"?"NO":"NO VOTE YET"}</span></a>`}).join("")}</div>`:"";
  const rollHTML=list.length?`<div class="feed">${(big.length?big:list).slice(0,8).map(v=>`<a class="ev" href="${vSrc(v)}"><span class="d">${fmtD(v.date)}</span><span>${v.ch==="s"?"Senate":"House"}: ${esc(plainQ(v.q))}<small>${v.t.Y}–${v.t.N} · ${esc(v.result)}</small></span></a>`).join("")}</div>`:"";
  if(!b){
    const sum=(extra&&extra.summary)||"";
    app.innerHTML=`<div class="hint">${esc(info.num)}${info.law?" · became law":""}</div><h1 style="font-size:clamp(18px,4vw,26px)">${esc(info.title)}</h1>
    ${info.latest?`<div class="you"><b>Latest:</b> ${esc(info.latest.t)} <span class="hint">(${fmtD(info.latest.d)})</span></div>`:""}
    <h2>WHAT IT DOES</h2>${sum?`<div class="sec" style="white-space:pre-line">${esc(sum.length>1500?sum.slice(0,1500)+"…":sum)}</div><p class="hint" style="font-size:14px">Summary by the Congressional Research Service.</p>`:`<div class="empty">No official summary yet.</div>`}
    ${rollHTML?`<h2>HOW IT MOVED</h2>${rollHTML}`:""}
    <h2>HOW WOULD YOU VOTE?</h2>${vbtns({id})}
    ${delegationHTML}
    ${sp?`<h2>SPONSOR</h2><div class="roster">${tile(sp)}</div>`:""}
    <h2>SOURCE</h2><div class="links"><a href="${cg((info.t[0]==="s"?"senate-":"house-")+({hr:"bill",s:"bill",hres:"resolution",sres:"resolution",hjres:"joint-resolution",sjres:"joint-resolution",hconres:"concurrent-resolution",sconres:"concurrent-resolution"}[info.t]||"bill"),info.n)}">Congress.gov ↗</a></div>`;
    wireVotes(()=>{const y=scrollY;bill(id).then(()=>scrollTo(0,y))});return;
  }
  app.innerHTML=`<div class="hint">${b.num} · ${b.status||"became law"}</div><h1>${esc(b.short)}</h1><p style="font-size:19px">${esc((PLAIN[id]||b).one)}</p>
  ${PLAIN[id]?`<div class="you"><b>What it means for you</b><ul>${PLAIN[id].you.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
  <h2>WHAT IT DOES</h2>
  ${b.secs.length?b.secs.map(s=>`<div class="sec"><b>${s[0]}</b> ${s[1]}</div>`).join(""):`<div class="sec">${esc(b.one)}</div>`}
  <div class="sides"><div><b>Supporters say</b>${b.pro}</div><div><b>Opponents say</b>${b.con}</div></div>
  ${PLAIN[id]?fold("WORDS TO KNOW",`<dl class="terms">${PLAIN[id].terms.map(t=>`<div><dt>${t[0]}</dt><dd>${t[1]}</dd></div>`).join("")}</dl>`):""}
  <h2>HOW IT MOVED</h2><div class="feed">${(STEPS[id]||[]).map(st=>`<div class="ev"><span class="d">${fmtD(st[0])}</span><span>${st[1]}<small>${st[2]||""}</small></span></div>`).join("")}</div>
  <h2>HOW WOULD YOU VOTE?</h2>${vbtns(b)}
  ${delegationHTML}
  ${sp?`<h2>SPONSOR</h2><div class="roster">${tile(sp)}</div>`:""}
  ${store.home?fold("TELL YOUR REPS",delegation(store.home).filter(m=>m.c==="s"||!store.me||!store.me.cd||String(m.d)===String(store.me.cd)).map(m=>contactBox(m,b)).join("")):""}
  <h2>SOURCE</h2><div class="links"><a href="${cg(b.t,b.n)}">Congress.gov ↗</a><a href="${cg(b.t,b.n,"/text")}">Full text ↗</a>${b.pl?`<a href="https://www.govinfo.gov/app/details/${b.pl}">GovInfo ↗</a>`:""}</div>
  <p class="hint" style="margin-top:12px;font-size:14px">Plain-English summary written by hand. Check the official text.</p>`;
  wireVotes(()=>{const y=scrollY;bill(id).then(()=>scrollTo(0,y))});wireContact();
}
async function updates(){
  const s=store.home,al=store.alerts||{};
  const del=s?delegation(s):[];const maps=s?Object.fromEntries(await Promise.all(del.map(async m=>[m.id,await mVotes(m.id)]))):{};
  if(location.hash!=="#updates")return;
  const mine=v=>{if(!s)return"";const ms=del.filter(m=>m.c===v.ch);let y=0,n=0,o=0;ms.forEach(m=>{const k=maps[m.id][v.id];if(!k)return;k==="Y"?y++:k==="N"?n++:o++});return y+n+o?`<span class="mine">${esc(SN[s])}: <b style="color:var(--ok)">${y} yes</b> · <b style="color:var(--R)">${n} no</b>${o?` · ${o} other`:""}</span>`:""};
  const ev=VX.filter(v=>v.big&&(!(store.topics||[]).length||(v.bill&&billTopics(v.bill).some(t=>store.topics.includes(t))))).slice(0,30);
  let recap="";
  if(ev.length){const end=new Date(ev[0].date+"T12:00:00"),mon=new Date(end);mon.setDate(end.getDate()-((end.getDay()+6)%7));const ms=mon.toISOString().slice(0,10),wk=ev.filter(e=>e.date>=ms);
    recap=`<div class="you"><b>Week of ${fmtD(ms)}</b> <span class="hint">(latest week with votes)</span><ul>${wk.slice(0,8).map(v=>`<li><b>${esc(vTitle(v))}</b>: ${v.ch==="s"?"Senate":"House"} vote to ${esc(plainQ(v.q).replace(/^Vote to /,"").toLowerCase())}, ${v.t.Y}–${v.t.N} (${esc(v.result.toLowerCase())}).${s?" "+mine(v).replace(/<[^>]+>/g,"")+".":""}</li>`).join("")}</ul></div>`}
  app.innerHTML=`<h1>Updates</h1>
  <h2>60-SECOND RECAP</h2>${recap||'<div class="empty">Nothing in your topics yet.</div>'}
  <h2>TOPICS I FOLLOW</h2>${topicChips()}<p class="hint" style="font-size:14px">Pick topics to only see those bills. None picked shows everything.</p>
  ${fold("NOTIFY ME",`<div class="log">
   ${[["before","Before a bill I voted on comes to the floor"],["result","When a vote happens, with how my members voted"],["new","When my members introduce a new bill"]].map(([k,t])=>`<label class="tg"><input type="checkbox" data-k="${k}" ${al[k]?"checked":""}>${t}</label>`).join("")}</div>
  <div class="ok" id="ok" ${Object.values(al).some(Boolean)?"":"hidden"}>Saved on this device. Alerts aren't sent yet.</div>`)}
  ${s?"":`<p class="hint" style="margin-top:10px"><a href="#ballot">Set your state</a> to see how your own members voted on each update.</p>`}
  <h2>RECENT VOTES ON BILLS</h2><div class="feed">${ev.map(v=>`<a class="ev" href="${vLink(v)||vSrc(v)}"><span class="d">${fmtD(v.date)}</span><span>${esc(vTitle(v))}<small>${v.ch==="s"?"Senate":"House"} · ${esc(plainQ(v.q))} · ${v.t.Y}–${v.t.N}</small></span>${mine(v)}</a>`).join("")||'<div class="empty">No votes loaded yet.</div>'}</div>`;
  wireTopics(()=>{const y=scrollY;updates().then(()=>scrollTo(0,y))});
  app.querySelectorAll(".tg input").forEach(c=>c.onchange=()=>{store.alerts=Object.assign(store.alerts||{},{[c.dataset.k]:c.checked});save();document.getElementById("ok").hidden=!Object.values(store.alerts).some(Boolean)});
}
// Back button: steps back through pages viewed in this visit, or up to the parent page.
const navStack=[location.hash];
addEventListener("hashchange",()=>{const h=location.hash;if(navStack.length>1&&navStack[navStack.length-2]===h)navStack.pop();else navStack.push(h)});
function parentOf(h){h=h.slice(1);if(h.startsWith("m-")){const m=byId[h.slice(2)];return m?"#s-"+m.s:"#"}if(h.startsWith("h-"))return"#m-"+h.slice(2);if(h.startsWith("l-"))return"#s-"+h.split("-")[1];if(h.startsWith("b-"))return"#ballot";return"#"}
document.getElementById("bk").onclick=()=>{if(navStack.length>1)history.back();else location.hash=parentOf(location.hash)};
const _wc=()=>setTimeout(wireContact,0);
function route(){const h=location.hash.slice(1);document.getElementById("bk").hidden=!h||h==="ballot"||h==="updates";document.getElementById("nmap").classList.toggle("on",h!=="ballot"&&h!=="updates");document.getElementById("nupd").classList.toggle("on",h==="updates");document.getElementById("nbal").classList.toggle("on",h==="ballot");
  if(h==="ballot")ballot();else if(h==="updates")updates();else if(h.startsWith("s-"))state(h.slice(2));else if(h.startsWith("m-"))member(h.slice(2));else if(h.startsWith("l-")){const[a,b]=h.slice(2).split("-");legislator(a,b)}else if(h.startsWith("h-"))memHistory(h.slice(2));else if(h.startsWith("b-"))bill(h.slice(2));else home();scrollTo(0,0)}
Promise.all([J("data/members.json"),J("data/votes/index.json"),J("data/meta.json"),J("data/member_stats.json"),J("data/bills.json"),J("data/portraits.json")]).then(async([d,vx,meta,stats,bl,pt])=>{PORT=new Set(pt||[]);
  if(!d)throw new Error("members");
  M=d.sort((a,b)=>a.l.localeCompare(b.l));byId=Object.fromEntries(M.map(m=>[m.id,m]));
  VX=vx||[];VI=Object.fromEntries(VX.map(v=>[v.id,v]));META=meta||{};STATS=stats||{};BL=bl||{};
  const up=[META.votes,META.members].filter(Boolean).sort().pop();
  document.getElementById("foot").textContent=`Members and votes come from congress-legislators, the House Clerk and the Senate; bills from Congress.gov; money from the FEC; state lawmakers from Open States.${up?" Updated "+fmtD(up.slice(0,10))+".":""} A dash means not loaded yet.`;
  await Promise.all(BILLS.map(b=>votesOnBill(b.id)));
  addEventListener("hashchange",route);route()}).catch(()=>{app.innerHTML="<p>Couldn't load the data. Reload to try again.</p>"});
}
